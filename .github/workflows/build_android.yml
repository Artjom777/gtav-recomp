name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      xex_url:
        description: 'Direct URL to default.xex (optional, to build gtav-android-pack.zip)'
        required: false
        type: string
        default: ''
      tu_url:
        description: 'Direct URL to tu / default.xexp (optional)'
        required: false
        type: string
        default: ''
      build_poco:
        description: 'Build optimized APK for POCO X7 Pro'
        required: false
        type: boolean
        default: true
      build_standard:
        description: 'Build standard arm64-v8a APK'
        required: false
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs & Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.1.12297006"

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-pip clang lld libvulkan-dev spirv-tools rsync zip unzip pkg-config \
            libx11-xcb-dev libwayland-dev libgtk-3-dev libxss-dev libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Configure Environment
        run: |
          SDK_DIR=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}
          echo "ANDROID_HOME=${SDK_DIR}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> $GITHUB_ENV

          SDKMANAGER_PATH=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER_PATH" ]; then
            SDKMANAGER_DIR=$(dirname "$SDKMANAGER_PATH")
            echo "$SDKMANAGER_DIR" >> $GITHUB_PATH
          fi

          ANDROID_NDK_HOME=$(find ${SDK_DIR}/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> $GITHUB_ENV

          mkdir -p ~/android-tools
          cat << EOF > ~/android-tools/env.sh
          export ANDROID_HOME=${SDK_DIR}
          export ANDROID_NDK_HOME=${ANDROID_NDK_HOME}
          export NDK_HOME=${ANDROID_NDK_HOME}
          export PATH=${SDK_DIR}/platform-tools:\$PATH
          EOF

      - name: Clone and Patch Submodules & Dependencies
        run: |
          echo "=== Cloning and patching dependencies ==="
          ROOT="$GITHUB_WORKSPACE"

          # 1. rexglue-sdk
          git clone https://github.com/rexglue/rexglue-sdk rexglue-sdk
          git -C rexglue-sdk checkout f5337cd
          git -C rexglue-sdk submodule update --init --recursive
          git -C rexglue-sdk/thirdparty/sdl3 apply "$ROOT/sdl3-gtav.patch"
          git -C rexglue-sdk/thirdparty/FFmpeg apply "$ROOT/ffmpeg-gtav.patch"
          git -C rexglue-sdk apply "$ROOT/rexglue-sdk-gtav-linux.patch"

          # 2. plume
          mkdir -p thirdparty
          git clone --recursive https://github.com/renderbag/plume thirdparty/plume
          git -C thirdparty/plume checkout 0ce184b
          git -C thirdparty/plume apply "$ROOT/plume-gtav.patch"

          # 3. XenosRecomp
          git clone --recursive https://github.com/hedge-dev/XenosRecomp thirdparty/XenosRecomp
          git -C thirdparty/XenosRecomp checkout 990d03b
          git -C thirdparty/XenosRecomp apply "$ROOT/xenosrecomp-gtav.patch"
          chmod +x thirdparty/XenosRecomp/thirdparty/dxc-bin/bin/x64/dxc-linux

      - name: Build POCO X7 Pro Optimized APK & Libraries (ARMv9.2-A / Cortex-A725)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_poco }}
        run: |
          echo "=== Building POCO X7 Pro Optimized APK and Libraries ==="
          CLANG=$(find "$ANDROID_NDK_HOME" -name "aarch64-linux-android*-clang" | head -n 1)
          POCO_MARCH="armv8.2-a+lse+rcpc+dotprod"
          if "$CLANG" -march=armv9.2-a -E -x c /dev/null -o /dev/null 2>/dev/null; then
            POCO_MARCH="armv9.2-a"
          elif "$CLANG" -march=armv9-a -E -x c /dev/null -o /dev/null 2>/dev/null; then
            POCO_MARCH="armv9-a"
          fi
          echo "POCO_MARCH: $POCO_MARCH"

          # 1. Build SDK for POCO
          BUILD=rexglue-sdk/out/build/android-poco PREFIX=rexglue-sdk/out/install/android-poco MARCH="$POCO_MARCH" ./tools/android/build_sdk.sh all

          # 2. Build gtav libraries for POCO
          mkdir -p build/android-poco-dll
          cmake -S gtav -B build/android-poco-dll -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGTAV_ARM64_MARCH="$POCO_MARCH" \
            -DCMAKE_C_FLAGS="-O3 -fno-semantic-interposition" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-semantic-interposition" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/rexglue-sdk/out/install/android-poco" \
            -Drexglue_DIR="$PWD/rexglue-sdk/out/install/android-poco/lib/cmake/rexglue" \
            -DSDL3_DIR="$PWD/rexglue-sdk/out/install/android-poco/lib/cmake/SDL3" \
            -DCMAKE_FIND_PACKAGE_NO_PACKAGE_REGISTRY=ON \
            -DGTAV_GAME_DLL=ON
          cmake --build build/android-poco-dll -j$(nproc)

          # 3. Package POCO APK
          mkdir -p artifacts
          RELEASE=1 APK_NAME=gtav-recomp-poco-x7-pro \
            SDK_LIB="$PWD/rexglue-sdk/out/install/android-poco/lib" \
            LIBS_OVERRIDE="$PWD/build/android-poco-dll/libmain.so $PWD/build/android-poco-dll/libgtav_fast.so $PWD/build/android-poco-dll/libgtav_setup.so" \
            ./tools/android/build_apk.sh

          cp build/android/apk/gtav-recomp-poco-x7-pro.apk artifacts/

          # 4. Export compiled native shared libraries (.so)
          mkdir -p artifacts/poco-x7-pro-libs
          cp build/android/apk/libs/gtav-recomp-poco-x7-pro/*.so artifacts/poco-x7-pro-libs/
          (cd artifacts/poco-x7-pro-libs && zip -r ../gtav-libs-poco-x7-pro.zip ./*.so)
          tar -czf artifacts/gtav-libs-poco-x7-pro.tar.gz -C artifacts/poco-x7-pro-libs .

      - name: Build Standard ARM64 APK & Libraries (arm64-v8a)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_standard }}
        run: |
          echo "=== Building Standard ARM64 APK and Libraries ==="
          # 1. Build SDK
          ./tools/android/build_sdk.sh all

          # 2. Build gtav libraries
          mkdir -p build/android-dll
          cmake -S gtav -B build/android-dll -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$PWD/rexglue-sdk/out/install/android-arm64" \
            -Drexglue_DIR="$PWD/rexglue-sdk/out/install/android-arm64/lib/cmake/rexglue" \
            -DSDL3_DIR="$PWD/rexglue-sdk/out/install/android-arm64/lib/cmake/SDL3" \
            -DCMAKE_FIND_PACKAGE_NO_PACKAGE_REGISTRY=ON \
            -DGTAV_GAME_DLL=ON
          cmake --build build/android-dll -j$(nproc)

          # 3. Package standard APK
          mkdir -p artifacts
          RELEASE=1 APK_NAME=gtav-recomp-arm64-v8a ./tools/android/build_apk.sh
          cp build/android/apk/gtav-recomp-arm64-v8a.apk artifacts/

          # 4. Export compiled native shared libraries (.so)
          mkdir -p artifacts/arm64-v8a-libs
          cp build/android/apk/libs/gtav-recomp-arm64-v8a/*.so artifacts/arm64-v8a-libs/
          (cd artifacts/arm64-v8a-libs && zip -r ../gtav-libs-arm64-v8a.zip ./*.so)
          tar -czf artifacts/gtav-libs-arm64-v8a.tar.gz -C artifacts/arm64-v8a-libs .

          # 5. Generate Android shell package
          mkdir -p dist/android
          ./tools/android/make_shell.sh dist/android
          tar -czf artifacts/gtav-android-shell.tar.gz -C dist android

      - name: Build Game Pack (gtav-android-pack.zip) if game files provided
        run: |
          set -e
          echo "=== Checking for game executable files ==="
          mkdir -p assets gtav/assets generated/default gtav/generated/default
          XEX_URL="${{ github.event.inputs.xex_url }}"
          TU_URL="${{ github.event.inputs.tu_url }}"
          if [ -n "$XEX_URL" ]; then
            echo "Downloading default.xex from $XEX_URL..."
            curl -L -o assets/default.xex "$XEX_URL"
          fi
          if [ -n "$TU_URL" ]; then
            echo "Downloading Title Update / default.xexp from $TU_URL..."
            curl -L -o assets/tu_file "$TU_URL"
            if grep -q "XEX2" assets/tu_file 2>/dev/null || [ $(wc -c < assets/tu_file) -lt 15000000 ]; then
              mv assets/tu_file assets/default.xexp
            fi
          fi

          if [ -f "assets/default.xex" ] && [ -f "assets/default.xexp" ]; then
            echo "Found default.xex and default.xexp! Building host rexglue codegen tool with Clang..."
            cmake -S rexglue-sdk -B rexglue-sdk/out/build/host -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_CXX_STANDARD=23 \
              -DREXGLUE_BUILD_TESTS=OFF \
              -DREXGLUE_ENABLE_TRACY=OFF \
              -DSDL_X11_XSCRNSAVER=OFF
            cmake --build rexglue-sdk/out/build/host --target rexglue -j$(nproc)

            REXGLUE_BIN=$(find "$PWD/rexglue-sdk/out/build/host" -name rexglue -type f -executable 2>/dev/null | head -n 1)
            if [ -z "$REXGLUE_BIN" ]; then
              REXGLUE_BIN=$(find "$PWD/rexglue-sdk" -name rexglue -type f -executable 2>/dev/null | head -n 1)
            fi
            echo "Using rexglue binary at: $REXGLUE_BIN"
            chmod +x "$REXGLUE_BIN"
            "$REXGLUE_BIN" --version || true

            cp assets/default.xex gtav/assets/
            cp assets/default.xexp gtav/assets/
            cp tools/game_dll/codegen.partition.json generated/default/
            cp tools/game_dll/codegen.partition.json gtav/generated/default/

            echo "=== Running ReXGlue codegen ==="
            (cd gtav && "$REXGLUE_BIN" --force codegen gtav_manifest.toml)

            GEN_DIR="gtav/generated/default"
            if [ ! -f "$GEN_DIR/gtav_init.cpp" ] && [ -f "generated/default/gtav_init.cpp" ]; then
              GEN_DIR="generated/default"
            fi
            echo "Codegen output directory: $GEN_DIR"
            ls -la "$GEN_DIR" | head -n 20

            mkdir -p artifacts/pack
            mkdir -p build/link-android
            cp artifacts/poco-x7-pro-libs/libgtav_fast.so build/link-android/
            cp artifacts/poco-x7-pro-libs/librexruntime.so build/link-android/

            LLVM_BIN=$(dirname $(find "$ANDROID_NDK_HOME" -name "aarch64-linux-android*-clang" | head -n 1))
            echo "Using LLVM_BIN: $LLVM_BIN"
            python3 tools/game_dll/build_game_dll.py "$LLVM_BIN" "$GEN_DIR" build/android-poco-dll/game_interface artifacts/pack --android build/link-android

            # Compute shell hash directly from the packaged APK to match SetupActivity verification
            SHELL_HASH=$(unzip -p artifacts/gtav-recomp-poco-x7-pro.apk lib/arm64-v8a/libgtav_fast.so | sha256sum | cut -d' ' -f1)
            echo "Pack shell hash: $SHELL_HASH"
            printf "gtav-recomp android pack 1\nshell %s\n" "$SHELL_HASH" > artifacts/pack/pack.txt
            cp tools/release/expected.txt artifacts/pack/expected.txt

            (cd artifacts/pack && zip -r ../gtav-android-pack.zip libgtav_game.so pack.txt expected.txt)
            echo "Created artifacts/gtav-android-pack.zip successfully!"
            ls -lh artifacts/gtav-android-pack.zip
          else
            echo "No default.xex / default.xexp provided. Skipping gtav-android-pack.zip build."
          fi

      - name: List Artifacts
        run: |
          echo "=== Artifacts to be published ==="
          ls -lh artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gtav-recomp-android-release
          path: |
            artifacts/*.apk
            artifacts/*.zip
            artifacts/*.tar.gz

      - name: Generate Release Tag
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create_release)
        id: vars
        run: |
          echo "tag=android-$(date +'%Y%m%d%H%M')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "GTA V Recomp Android Build (${{ steps.vars.outputs.date }})"
          prerelease: false
          make_latest: true
          files: |
            artifacts/*.apk
            artifacts/*.zip
            artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
